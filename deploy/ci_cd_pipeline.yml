name: Sales Analytics Data Warehouse CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations Check
        run: |
          python main.py --action migrate

      - name: Execute Full ETL & Data Quality Pipeline
        run: |
          python main.py --action full-run

      - name: Run Automated Pytest Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify Reconciliation Gate
        run: |
          python main.py --action reconcile
